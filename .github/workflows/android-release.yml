# KOiL Release
#
# 触发：仅推送大写 V 标签（与 App versionName 风格统一）。
#   与 android-build.yml 拆分的原因：tags 与 branches 共用一个 paths-ignore: '**.md' 时，
#   纯文档提交上打的 tag 会因为 paths 过滤被整体跳过，Release 静默不发。
#   拆分后 tag 构建永不带路径过滤，文档改动不影响发版。
# 产物：KOiL-Vx.y.z-vcN-release.apk 自动发布为 GitHub Release（release 签名，签名材料由
#   GitHub Secrets 注入；任一 Secret 缺失即失败，并在上传/发布前断言正式证书指纹，
#   绝不静默回落 debug 签名）。
# versionCode：注入 KOIL_CI_VERSION_CODE = Build 最大 run_number + 已发布版本数 + 1，
#   与 android-build.yml 的号严格交替、互不重合；推导见下方 Resolve versionCode 步骤。
#
# 签名材料只在 GitHub Secrets：SIGNING_KEYSTORE_B64（keystore 的 base64）、
#   SIGNING_PROPERTIES（keystore.properties 全文）。本地构建仍用工作区内的这两个文件（已 gitignore）。
name: Release

on:
  push:
    tags: ['V*']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages (runner 预装 SDK，用预装 sdkmanager 补 platform 37 + build-tools 37)
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          ln -sfn "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37.0" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/gradle-with-retry.sh

      # 发布闸门①：两个签名 Secret 必须同时存在且可恢复，缺失即失败，
      # 避免签名材料不全时静默回落 debug 签名后照常发 Release。
      - name: Restore signing keystore from secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PROPERTIES" ]; then
            echo "::error::缺少签名 Secrets：SIGNING_KEYSTORE_B64 / SIGNING_PROPERTIES 必须同时配置"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > keystore/koil-release.keystore
          printf '%s' "$SIGNING_PROPERTIES" > keystore.properties
          if [ ! -s keystore/koil-release.keystore ] || ! grep -q 'storePassword' keystore.properties; then
            echo "::error::签名材料恢复失败（keystore 为空，或 properties 缺 storePassword）"
            exit 1
          fi
          echo "keystore 已从 Secrets 恢复"

      # versionCode 的唯一规则：只增不减，必须高于任何已分发安装包，且不得与任何 Build 包同号。
      # 不能直接用 github.run_number：Release 是独立 workflow，run_number 从 1 重算。
      # 与 android-build.yml 共用「已发布版本数 N」这个偏移量：
      #   Build 号 = run_number + N（见 android-build.yml 的 Resolve 步骤）
      #   Release 号 = build_max_run_number + N + 1
      # 发版时的号恰好是「下一次 Build 会拿到的号 + 1」，两条线严格交替、永不同号。
      # 若改用 max(已发布最大, run_number) + k，则发版后已发布号领先，之后每个 run 更小的
      # Build 都会落到同一个值上，连续构建必然撞号 —— 这是本步骤不用水位法的原因。
      - name: Resolve versionCode from published releases and Build runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 两个输入（Release 列表、Build 运行记录）都在构建前一次取回，快照给 Verify 复用。
          # 读取失败必须显式失败：Release 号 = BUILD_MAX + 已发布数 + 1，任一读成 0 都会算出一个
          # 远小的号，再被下面的兜底抬到 MAX+1 —— 那个值可能正好是下一次 Build 的号，直接撞号。
          # 正式包公开且不可撤回，这里比 Build 侧更不能「读不到就当 0」。
          # 分页取回后用 jq -s 'add' 合并：gh 对数组端点的多页输出形态随版本而变
          # （2.86 直接并成一个数组；带 --jq 时是逐页各打一个数组），slurp+add 两种都成立。
          # stderr 单独收：失败时要打出 gh 的真实原因（403 / 502 / 网络），否则判断不了该重试还是改权限。
          ERR=$(mktemp)
          if ! RELEASE_PAGES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate 2>"$ERR"); then
            echo "::error::读取 Release 列表失败（gh api 退出非 0）：$(tr '\n' ' ' < "$ERR" | head -c 500)"
            exit 1
          fi
          # 空体也是「读不到」：gh 退出 0 但 body 为空时，jq -s 的 add 得 null、`// []` 变成空数组，
          # REL_COUNT 与 MAX 双双退化成 0，Release 号会算成 BUILD_MAX + 0 + 1 并可能撞上 Build 的号。
          if [ -z "$(printf '%s' "$RELEASE_PAGES" | tr -d '[:space:]')" ]; then
            echo "::error::Release 列表返回内容为空（gh api 退出 0 但无 body），无法推算 versionCode"
            exit 1
          fi
          # 不写 `add // []`：字面量 null 会被兜成空数组，REL_COUNT 与 MAX 双双归 0，
          # 与空 body 同一个后果（Release 号可能撞上下一次 Build 的号）。
          # 这里要求 add 的结果必须是数组，null / 对象 / 字符串一律失败。
          if ! RELEASES=$(printf '%s' "$RELEASE_PAGES" \
               | jq -s -e 'add | if type == "array" then . else error("not an array") end | map(select(.draft == false and .prerelease == false))'); then
            echo "::error::解析 Release 列表失败（返回内容不是 JSON 数组，或为 null），无法推算 versionCode"
            exit 1
          fi
          REL_COUNT=$(printf '%s' "$RELEASES" | jq 'length')
          # 取附件 name 而不是整个 asset 对象：browser_download_url 也含 -vcN，附件改名后会给出不同的号。
          # 解析失败不能静默——读成 0 等于闸门失效；「没有带 -vcN 的附件」才该是 0。
          # 注意：附件存在但缺 name 时同样归 0、不报错（jq 输出字面量 "null"，不含 -vcN）。
          # GitHub 的 asset 必有 name，缺 name 只可能来自裁剪过的构造响应，这里按「无可解析号」
          # 处理——与上面的「解析失败」刻意区分，避免把结构异常和「没有附件」混为一类。
          if ! ASSET_NAMES=$(printf '%s' "$RELEASES" | jq -r '.[] | (.assets // [])[].name'); then
            echo "::error::解析 Release 附件名失败（assets 字段结构异常），无法推算已发布最大 versionCode"
            exit 1
          fi
          MAX_PUBLISHED=$(printf '%s\n' "$ASSET_NAMES" | grep -oE -- '-vc[0-9]+' | sed 's/-vc//' | sort -n | tail -1 || true)
          MAX_PUBLISHED=${MAX_PUBLISHED:-0}

          if ! RUN_NUMBERS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --paginate \
               --jq '.workflow_runs[] | select(.name == "Build") | .run_number' 2>"$ERR"); then
            echo "::error::读取 Build 运行记录失败（gh api 退出非 0）：$(tr '\n' ' ' < "$ERR" | head -c 500)"
            exit 1
          fi
          BUILD_MAX=$(printf '%s\n' "$RUN_NUMBERS" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$BUILD_MAX" ]; then
            # 两种成因都要写出来：查错方向完全不同，只提示「workflow 名称被改」会把人带去改名字。
            echo "::error::Build 运行记录里取不到 run_number。常见成因：① 本仓库从未跑过 Build 工作流（main 只推过被 paths-ignore 跳过的文档提交）；② Build 工作流名称被改过，name == \"Build\" 匹配不到。"
            exit 1
          fi

          RAW=$(( BUILD_MAX + REL_COUNT + 1 ))
          NEXT=$RAW
          if [ "$NEXT" -le "$MAX_PUBLISHED" ]; then
            echo "::warning::推算号 $NEXT 未超过已发布最大 $MAX_PUBLISHED（Build 记录或 Release 列表不一致），回退到 $MAX_PUBLISHED+1"
            NEXT=$(( MAX_PUBLISHED + 1 ))
          fi
          # 兜底只改注入号、不改 RAW：Verify 的「RAW > 快照 MAX」断言仍会失败，
          # 所以号段真的不一致时发布会在这里之后被拦下，不会拿一个可能撞号的号发出去。
          echo "KOIL_CI_VERSION_CODE=$NEXT" >> "$GITHUB_ENV"
          echo "KOIL_CI_VERSION_CODE_RAW=$RAW" >> "$GITHUB_ENV"
          echo "KOIL_CI_MAX_PUBLISHED=$MAX_PUBLISHED" >> "$GITHUB_ENV"
          echo "versionCode = Build 最大 $BUILD_MAX + 已发布 $REL_COUNT 版 + 1 = $NEXT（原始规划号 $RAW，已发布最大 $MAX_PUBLISHED）"

      - name: Build Release APK
        # 重试包装：规则与 android-build.yml 一致（Build #73 依赖解析抖动事故的防再发）
        run: .github/scripts/gradle-with-retry.sh ./gradlew assembleRelease --no-daemon --console=plain

      # 发布闸门②：产物必须是正式证书签名；同时校验 tag 格式、tag 与 versionName 一致、
      # 版本不低于 1.0.0 且严格高于已有最高 tag、tag 提交是 main 祖先、同名 Release 不存在、
      # versionCode 不得低于已发布最大值。全部放在 Publish 之前，任何一项不符都不会有包流到公开渠道。
      - name: Verify release signing and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner（$SDK_ROOT/build-tools/*/apksigner）"
            exit 1
          fi
          AAPT2=$(ls -1 "$SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$AAPT2" ]; then
            echo "::error::未找到 aapt2（$SDK_ROOT/build-tools/*/aapt2）"
            exit 1
          fi
          VC=$("$AAPT2" dump badging "$APK" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [ -z "$VC" ]; then
            echo "::error::无法从 APK 读取 versionCode"; exit 1
          fi
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          EXPECTED="cc962f1e2524ba8273c9d668436e9926d8a056e49b816e680c730518d46ffe4b"
          CERT_OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          ACTUAL=$(printf '%s\n' "$CERT_OUT" | sed -n 's/^.*SHA-256 digest: //p' | sed -n '1p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::release APK 证书指纹不符：期望 $EXPECTED，实际 ${ACTUAL:-<空>}（很可能是 debug 签名）"
            exit 1
          fi
          echo "签名指纹校验通过：$ACTUAL"

          # versionCode 双断言，两个基准都取 Resolve 步骤的快照，本步骤不再现场重查：
          #   ① APK 里的号必须等于 Resolve 规划号 —— 拦手工指号、env 未注入、aapt 读错；
          #   ② 原始规划号（抬号前的 RAW）必须高于构建开始时的已发布最大 —— 拦 Build 记录 /
          #      Release 列表被读成 0、号段规则写错。
          # ② 之所以比 RAW 而不是比 NEXT：兜底会把异常号抬到 MAX+1，拿抬号后的值来比恒成立、
          # 形同没有断言，正是要拦的「号段塌陷」反而漏过。
          PLANNED="${KOIL_CI_VERSION_CODE:-}"
          RAW="${KOIL_CI_VERSION_CODE_RAW:-}"
          SNAPSHOT_MAX="${KOIL_CI_MAX_PUBLISHED:-}"
          if [ -z "$PLANNED" ] || [ -z "$RAW" ] || [ -z "$SNAPSHOT_MAX" ]; then
            echo "::error::versionCode 快照未注入（PLANNED=${PLANNED:-<空>} RAW=${RAW:-<空>} MAX=${SNAPSHOT_MAX:-<空>}），Resolve 步骤是否被跳过？"
            exit 1
          fi
          if [ "$VC" != "$PLANNED" ]; then
            echo "::error::APK versionCode $VC ≠ 规划号 $PLANNED（app/build.gradle.kts 是否被手工指号，或 aapt 读取异常）"
            exit 1
          fi
          echo "versionCode 与规划号一致：$VC"
          if [ "$RAW" -le "$SNAPSHOT_MAX" ]; then
            echo "::error::原始规划号 $RAW ≤ 构建开始时已发布最大 $SNAPSHOT_MAX（Build 记录或 Release 列表是否被读成 0？号段规则是否被改动？）"
            exit 1
          fi
          echo "versionCode 校验通过：$VC（原始规划号 $RAW > 构建开始时已发布最大 $SNAPSHOT_MAX）"

          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^V[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag 格式必须是 V数字.数字.数字，实际是 $TAG"; exit 1; }
          VN=$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/ {print $2; exit}' app/build.gradle.kts)
          [ "$VN" = "${TAG#V}" ] || {
            echo "::error::tag $TAG 与 versionName ${VN:-<空>} 不一致，先改 app/build.gradle.kts"; exit 1; }
          if [ "$(printf '%s\n%s\n' "1.0.0" "$VN" | sort -V | tail -1)" != "$VN" ]; then
            echo "::error::项目以 1.0.0 为起点，禁止发布更低版本（$VN）"; exit 1
          fi
          LATEST=$(git tag --list 'V*' --sort=-v:refname | grep -v -x "$TAG" | head -1 || true)
          if [ -n "$LATEST" ]; then
            PREV="${LATEST#V}"
            if [ "$VN" = "$PREV" ] || [ "$(printf '%s\n%s\n' "$PREV" "$VN" | sort -V | tail -1)" != "$VN" ]; then
              echo "::error::禁止版本回退：$VN 必须严格高于已有最高 tag $PREV"; exit 1
            fi
          fi
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::无法解析 origin/main，无法确认 tag 提交在 main 上"; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag 指向的提交不是 main 的祖先，请先合并 main 再打 tag"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，重复推同名 tag 会覆盖附件，请换新版本号"; exit 1
          fi
          echo "tag 校验通过：$TAG（versionName $VN）"

      # 自动发布 Release，附件即 APK 原文件，直接下载无需解压。
      # 附件名带 versionCode（-vcN），既是给用户的第二重标识，也是下一次发布
      # 「versionCode 只许向前」断言的比对依据，无需下载 APK 即可读取。
      - name: Rename APK for release
        run: cp app/build/outputs/apk/release/app-release.apk "KOiL-${GITHUB_REF_NAME}-vc${VERSION_CODE}-release.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: KOiL-*.apk
          generate_release_notes: true

      # 镜像到 Gitee Release：给国内提供一个直连下载通道（APK 6.6MB，GitHub 直连慢）。
      # 全程 best-effort —— 镜像任何一步失败都只打 warning 并 exit 0，绝不阻断上面的
      # GitHub Release：主发版通道不能因为镜像挂了而变红，否则一个令牌过期就能停掉发版。
      # 因此脚本内不开 set -e，每一步单独判错并给出可定位的 warning。
      #
      # 已知限制（都影响下面的实现，改之前先看完）：
      #   ① Gitee 的 attach_files 删除接口实测返回 405，无法只删单个附件 ——
      #      清理只能整条 Release 删，而删 Release 又不会连带删 tag，是两次调用。
      #   ② target_commitish 只能写 "master"：Gitee 默认分支，与 GitHub 的 SHA 不同源，
      #      写 SHA 会 404。
      #   ③ 下载走 302 跳转，校验必须 -L，否则只看得到 302 而不是 200。
      - name: Mirror APK to Gitee Release
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          # 保留最近 N 个版本，超出的进清理候选。
          GITEE_MIRROR_KEEP: "5"
          # 第一版固定 dry-run：DELETE 的真实行为没有在本地验证过（令牌只在 Secrets 里），
          # 先在真机上跑一轮看「待删清单」打印得对不对，确认无误后再改成 "false" 开真删。
          GITEE_MIRROR_DRY_RUN: "true"
        run: |
          set -uo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          TAG="$GITHUB_REF_NAME"
          APKF="KOiL-${TAG}-vc${VERSION_CODE}-release.apk"
          DOWN_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TAG}/${APKF}"

          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_OWNER:-}" ] || [ -z "${GITEE_REPO:-}" ]; then
            echo "::warning::Gitee 镜像跳过：GITEE_TOKEN / GITEE_OWNER / GITEE_REPO 未全部配置"
            exit 0
          fi
          if [ ! -f "$APKF" ]; then
            echo "::warning::Gitee 镜像跳过：找不到产物 ${APKF}"
            exit 0
          fi
          # 令牌只走 header，绝不拼进 URL —— URL 会原样出现在 Actions 日志里。
          AUTH=(-H "Authorization: token ${GITEE_TOKEN}")

          # ①建 Release。幂等：同名 tag 已有 Release 就复用，不重建。
          #   重建会先删掉旧附件（整条删是唯一可用手段），反而让重跑变成破坏性操作。
          REL=$(curl -sS --retry 2 "${AUTH[@]}" "${API}/releases/tags/${TAG}" 2>/dev/null || true)
          REL_ID=$(printf '%s' "$REL" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            echo "复用已存在的 Gitee Release：${TAG}（id=${REL_ID}）"
          else
            REL=$(curl -sS --retry 2 -X POST "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$TAG" '{tag_name:$t, name:$t, target_commitish:"master", prerelease:false,
                    body:("Gitee 镜像，正式签名包，源码与完整发布说明见 GitHub Release " + $t)}')" \
              "${API}/releases" 2>/dev/null || true)
            REL_ID=$(printf '%s' "$REL" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
            if [ -z "$REL_ID" ]; then
              echo "::warning::Gitee 建 Release 失败：$(printf '%s' "$REL" | head -c 300)"
              echo "::warning::Gitee 镜像中止（不影响 GitHub Release 已发布）"
              exit 0
            fi
            echo "已建 Gitee Release：${TAG}（id=${REL_ID}）"
          fi

          # ②上传附件。multipart + 字段名 file；Gitee 没有 GitHub 那种 uploads 预签名流程。
          #   已有同名附件就跳过，保证 workflow_dispatch 重跑幂等。
          EXIST=$(curl -sS --retry 2 "${AUTH[@]}" "${API}/releases/${REL_ID}" 2>/dev/null \
            | jq -r '(.assets // [])[].name' 2>/dev/null | grep -x -- "$APKF" || true)
          if [ -n "$EXIST" ]; then
            echo "附件已存在，跳过上传（幂等重跑）"
          else
            UP=$(curl -sS --retry 2 -X POST "${AUTH[@]}" \
              -F "file=@${APKF}" "${API}/releases/${REL_ID}/attach_files" 2>/dev/null || true)
            UP_URL=$(printf '%s' "$UP" | jq -r '.browser_download_url // empty' 2>/dev/null || true)
            if [ -z "$UP_URL" ]; then
              echo "::warning::Gitee 上传附件失败：$(printf '%s' "$UP" | head -c 300)"
              echo "::warning::Gitee 镜像中止（不影响 GitHub Release 已发布）"
              exit 0
            fi
            echo "已上传附件：${UP_URL}"
          fi

          # ③匿名下载校验。只 Trust「上传返回成功」证明不了「别人能下到正确文件」：
          #   之前踩过 web_fetch 抓 Gitee 返回 link dead，所以这里用真实 GET 下载完整字节做比对。
          LOCAL_SIZE=$(stat -c%s "$APKF")
          PROBE=$(curl -sSL -o /dev/null -w '%{http_code} %{size_download}' --retry 2 "$DOWN_URL" 2>/dev/null || echo "000 0")
          CODE=${PROBE%% *}
          SIZE=${PROBE##* }
          if [ "$CODE" != "200" ] || [ "$SIZE" != "$LOCAL_SIZE" ]; then
            echo "::warning::Gitee 镜像校验失败：HTTP ${CODE}，远端 ${SIZE} 字节 ≠ 本地 ${LOCAL_SIZE} 字节（${DOWN_URL}）"
            exit 0
          fi
          echo "Gitee 镜像校验通过：HTTP ${CODE} / ${SIZE} 字节 / ${DOWN_URL}"

          # ④清理。Gitee 免费仓 1GB（代码+附件合并计算），单文件上限 100MB；
          #   每版约 6.6MB，约 150 版才占满，短期不紧迫 —— 但手动清理必然会被忘记，
          #   所以放进自动化里，失败只 warning。排序用 created_at 而不是 tag 名：
          #   tag 排序在跨版本号时不可靠（V1.10.x 会排到 V1.9.x 前面是 sort -V 才解决，
          #   而这里要的是「最近发布」，与语义版本无关）。
          ALL=$(curl -sS --retry 2 "${AUTH[@]}" "${API}/releases?per_page=100" 2>/dev/null || true)
          if ! printf '%s' "$ALL" | jq -e 'type=="array"' >/dev/null 2>&1; then
            echo "::warning::Gitee Release 列表读取失败，跳过清理：$(printf '%s' "$ALL" | head -c 200)"
            exit 0
          fi
          TOTAL=$(printf '%s' "$ALL" | jq 'length')
          echo "Gitee 现有 ${TOTAL} 个 Release，保留最近 ${GITEE_MIRROR_KEEP} 个"
          TO_DEL=$(printf '%s' "$ALL" | jq -r --argjson keep "$GITEE_MIRROR_KEEP" \
            'sort_by(.created_at) | reverse | .[$keep:] | .[] | "\(.id)\t\(.tag_name)"')
          if [ -z "$TO_DEL" ]; then
            echo "无需清理"
            exit 0
          fi
          while IFS=$'\t' read -r rid rtag; do
            [ -z "${rid:-}" ] && continue
            if [ "${GITEE_MIRROR_DRY_RUN}" = "true" ]; then
              echo "[dry-run] 将删除 Release id=${rid} / tag=${rtag}（Release 与 tag 各一次调用，不是同一次）"
              continue
            fi
            RC=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${AUTH[@]}" "${API}/releases/${rid}" 2>/dev/null || echo 000)
            case "$RC" in
              200|204) echo "已删 Release id=${rid}（HTTP ${RC}）" ;;
              *) echo "::warning::删 Release id=${rid} 返回 HTTP ${RC}（继续，不阻断清理后续项）" ;;
            esac
            TC=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${AUTH[@]}" "${API}/tags/${rtag}" 2>/dev/null || echo 000)
            case "$TC" in
              200|204) echo "已删 tag ${rtag}（HTTP ${TC}）" ;;
              *) echo "::warning::删 tag ${rtag} 返回 HTTP ${TC}（继续，不阻断）" ;;
            esac
          done <<< "$TO_DEL"
