# KOiL Build
#
# 触发：推送 main / 手动 workflow_dispatch / PR（轻量检查 job）。
#   V 标签构建已拆分到 android-release.yml：tags 与 branches 共用 paths-ignore 时，
#   纯文档提交上打的 tag 会因路径过滤被整体跳过、Release 静默不发。
#   日常构建保留路径过滤：文档（*.md）改动不触发构建。
# 产物：KOiL-release artifact（app-release.apk，release 签名，签名材料由 GitHub Secrets 注入；
#   任一 Secret 缺失即失败，并在上传前断言正式证书指纹，绝不静默回落 debug 签名）。
#   正式 Release（附件 + Release Notes）只由 android-release.yml 在打 V 标签时发布。
# versionCode：= github.run_number + 已发布版本数，由 Resolve 步骤在构建前解析；
#   与 android-release.yml 配合，Build 与 Release 的号严格交替、互不重合（推导见该步骤注释）。
#
# 签名材料只在 GitHub Secrets：SIGNING_KEYSTORE_B64（keystore 的 base64）、
#   SIGNING_PROPERTIES（keystore.properties 全文）。本地构建仍用工作区内的这两个文件（已 gitignore）。
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # PR 事件跑轻量检查（编译+单测+lint，不签名、不消耗发版资源）；
  # 签名与 versionCode 闸门只在 push main / 手动触发时执行
  pr-check:
    name: PR Check (compile + test + lint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 失败路径演练：gitee-mirror.sh 的全部价值都在「读不到列表 / 删不掉 tag」上，
      # 那些分支正常发版永远跑不到（keep=5，要到第 6 个版本才真删）。这个脚本不跑，
      # 等于把覆盖从 /tmp 挪进仓库躺着 —— S5 防的「把 --retry-all-errors 挪回 CURL」
      # 又恰恰是最容易被「顺手统一一下」写出来的回归。
      # 无 JDK/SDK 依赖，秒级，所以放在最前面，不必等 5 分钟的 Gradle。
      # 静态检查：演练脚本管「行为对不对」，shellcheck 管「写法有没有坑」——
      # 变量没加引号（路径带空格就拆参数）、`[ ]` 里用 `&&`、`local x=$(cmd)` 吞掉
      # 退出码，这些演练一条都跑不出来，只能靠读。
      # 只拦 warning 及以上：三文件现有 info 全是 SC2015（`ok … && … || bad …`），
      # 那是测试输出写法不是缺陷；gitee-mirror.sh 那条 SC2016 是单引号里刻意写的 `$`。
      - name: shellcheck 静态检查
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning .github/scripts/*.sh

      - name: gitee-mirror 失败路径演练
        run: bash .github/scripts/test-gitee-mirror.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          ln -sfn "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37.0" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/gradle-with-retry.sh

      # 包装脚本：依赖解析/网络抖动导致的失败自动重试一次（Build #73 事故的防再发），
      # 编译/测试等真实失败不重试，边界见 .github/scripts/gradle-with-retry.sh 头注释
      - name: Compile + Unit tests + Lint
        run: .github/scripts/gradle-with-retry.sh ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

  build-apk:
    name: Build APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages (runner 预装 SDK，用预装 sdkmanager 补 platform 37 + build-tools 37)
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          ln -sfn "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37.0" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/gradle-with-retry.sh

      # versionCode 分配：run_number + 已发布版本数。
      # 不能用裸 run_number——重建仓库 / 换 CI 后它从 1 重来，会落在已发布正式版之下，系统判降级。
      # 也不能用 max(已发布最大, run_number) + 1——发版后已发布号领先 run_number，此后每个
      # run < 已发布号的 Build 都会落到同一个 P+1 上，连续构建立刻撞号。
      # 以「已发布版本数 N」作固定偏移后，Build 号恒为 run_number + N（随 run_number 严格递增），
      # Release 号取 build_max_run_number + N + 1，两条线恰好交替、无一重合。
      - name: Resolve versionCode (run_number + released count)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 一次取回 Release 列表再本地解析：读取失败必须显式失败 ——
          # 读不到列表时若按「0 个已发布版本」继续，RAW 会算成裸 run_number 并通过后面的比较，
          # 「run_number 归零」这类事故就被静默放行了。
          # 分页取回后统一用 jq -s 'add' 合并：gh 对数组端点的多页输出形态随版本而变
          # （2.86 直接把多页并成一个数组；带 --jq 时是逐页各打一个数组、首尾相接），
          # slurp 再 add 对两种形态都成立，不依赖 gh 的实现细节。
          # stderr 单独收进文件：失败时要把 gh 的真实原因（403 / 502 / 网络）一起打出来，
          # 只报「读取失败」看不出该重试还是该改权限。
          ERR=$(mktemp)
          if ! RELEASE_PAGES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate 2>"$ERR"); then
            echo "::error::读取 Release 列表失败（gh api 退出非 0）：$(tr '\n' ' ' < "$ERR" | head -c 500)"
            exit 1
          fi
          # 空体也是「读不到」：gh 退出 0 但 body 为空（代理回空体 / 连接被截断）时，
          # jq -s 拿到空输入、add 得 null、`// []` 变成空数组，REL_COUNT 与 MAX 双双退化成 0，
          # 后面的「RAW > 快照 MAX」就恒成立。这是与「退出非 0」并列的第二条泄漏路径。
          if [ -z "$(printf '%s' "$RELEASE_PAGES" | tr -d '[:space:]')" ]; then
            echo "::error::Release 列表返回内容为空（gh api 退出 0 但无 body），无法推算 versionCode"
            exit 1
          fi
          # 不写 `add // []`：它会把字面量 null 也兜成空数组（gh 退出 0、代理却回 null 时），
          # 与空 body 是同一个后果——按 0 个版本算出一个号、断言② 恒过。
          # 这里要求 add 的结果必须是数组，null / 对象 / 字符串一律失败。
          if ! RELEASES=$(printf '%s' "$RELEASE_PAGES" \
               | jq -s -e 'add | if type == "array" then . else error("not an array") end | map(select(.draft == false and .prerelease == false))'); then
            echo "::error::解析 Release 列表失败（返回内容不是 JSON 数组，或为 null），无法推算 versionCode"
            exit 1
          fi
          REL_COUNT=$(printf '%s' "$RELEASES" | jq 'length')
          # 取附件 name 而不是整个 asset 对象：对象里的 browser_download_url 也含 -vcN，
          # 附件改名后两者会给出不同的号，sort | tail 取到哪个不确定。
          # 解析失败不能静默——读成 0 等于闸门失效；「没有带 -vcN 的附件」才该是 0。
          # 注意：附件存在但缺 name 时同样归 0、不报错（jq 输出字面量 "null"，不含 -vcN）。
          # GitHub 的 asset 必有 name，缺 name 只可能来自裁剪过的构造响应，这里按「无可解析号」
          # 处理——这与上面的「解析失败」刻意区分，避免把结构异常和「没有附件」混为一类。
          if ! ASSET_NAMES=$(printf '%s' "$RELEASES" | jq -r '.[] | (.assets // [])[].name'); then
            echo "::error::解析 Release 附件名失败（assets 字段结构异常），无法推算已发布最大 versionCode"
            exit 1
          fi
          MAX_PUBLISHED=$(printf '%s\n' "$ASSET_NAMES" | grep -oE -- '-vc[0-9]+' | sed 's/-vc//' | sort -n | tail -1 || true)
          # 列表可读但没有已发布版本时才是 0；读不到的情况已在上面直接失败。
          MAX_PUBLISHED=${MAX_PUBLISHED:-0}
          RAW=$(( ${{ github.run_number }} + REL_COUNT ))
          NEXT=$RAW
          if [ "$NEXT" -le "$MAX_PUBLISHED" ]; then
            echo "::warning::推算号 $NEXT 未超过已发布最大 $MAX_PUBLISHED（Release 列表与版本号不一致），回退到 $MAX_PUBLISHED+1"
            NEXT=$(( MAX_PUBLISHED + 1 ))
          fi
          # 兜底只改注入号、不改 RAW：Verify 的「RAW > 快照 MAX」断言仍会失败，
          # 所以号段真的不一致时构建会红，不会拿一个可能撞号的号继续发布。
          # 把两个基准快照给 Verify 步骤复用：Verify 不再现场重查 Release 列表 ——
          # 与本次构建并发发版时（同一个 commit 上 push main 与 push V 标签），
          # 正式包会先发布出去、号比这次 Build 高 1，现场重查会把正常的构建误判成「versionCode 回退」。
          echo "KOIL_CI_VERSION_CODE=$NEXT" >> "$GITHUB_ENV"
          echo "KOIL_CI_VERSION_CODE_RAW=$RAW" >> "$GITHUB_ENV"
          echo "KOIL_CI_MAX_PUBLISHED=$MAX_PUBLISHED" >> "$GITHUB_ENV"
          echo "versionCode = run_number ${{ github.run_number }} + 已发布 $REL_COUNT 版 = $NEXT（原始规划号 $RAW，构建开始时已发布最大 $MAX_PUBLISHED）"

      # 发布闸门①：两个签名 Secret 必须同时存在且可恢复，缺失即失败，
      # 避免签名材料不全时静默回落 debug 签名后照常发 Release。
      - name: Restore signing keystore from secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PROPERTIES" ]; then
            echo "::error::缺少签名 Secrets：SIGNING_KEYSTORE_B64 / SIGNING_PROPERTIES 必须同时配置"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > keystore/koil-release.keystore
          printf '%s' "$SIGNING_PROPERTIES" > keystore.properties
          if [ ! -s keystore/koil-release.keystore ] || ! grep -q 'storePassword' keystore.properties; then
            echo "::error::签名材料恢复失败（keystore 为空，或 properties 缺 storePassword）"
            exit 1
          fi
          echo "keystore 已从 Secrets 恢复"

      # 两个构建步骤同样走重试包装（规则同上；依赖已在 setup-gradle 缓存，
      # 抖动只发生在缓存未命中的冷启动，重试命中本地/上游缓存即恢复）
      - name: Build Debug APK
        run: .github/scripts/gradle-with-retry.sh ./gradlew assembleDebug --no-daemon --console=plain

      - name: Build Release APK
        run: .github/scripts/gradle-with-retry.sh ./gradlew assembleRelease --no-daemon --console=plain

      # 发布闸门②：产物必须是正式证书签名，且 versionCode 必须等于规划号、且规划号高于构建开始时的
      # 已发布最大值（两个基准都来自 Resolve 步骤的快照，见下方说明）。
      # tag 专属校验（tag 格式/与 versionName 一致/版本单调/main 祖先/同名 Release 查重）
      # 已随 tag 触发一并移入 android-release.yml，避免两套发布逻辑并存。
      - name: Verify release signing and versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner（$SDK_ROOT/build-tools/*/apksigner）"
            exit 1
          fi
          AAPT2=$(ls -1 "$SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$AAPT2" ]; then
            echo "::error::未找到 aapt2（$SDK_ROOT/build-tools/*/aapt2）"
            exit 1
          fi
          VC=$("$AAPT2" dump badging "$APK" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [ -z "$VC" ]; then
            echo "::error::无法从 APK 读取 versionCode"; exit 1
          fi
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          EXPECTED="cc962f1e2524ba8273c9d668436e9926d8a056e49b816e680c730518d46ffe4b"
          CERT_OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          ACTUAL=$(printf '%s\n' "$CERT_OUT" | sed -n 's/^.*SHA-256 digest: //p' | sed -n '1p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::release APK 证书指纹不符：期望 $EXPECTED，实际 ${ACTUAL:-<空>}（很可能是 debug 签名）"
            exit 1
          fi
          echo "签名指纹校验通过：$ACTUAL"

          # versionCode 双断言。两个基准都取 Resolve 步骤的快照，本步骤不再现场重查 Release 列表：
          #   ① APK 里的号必须等于 Resolve 规划号 —— 拦 git 里手工指号、env 未注入、aapt 读错；
          #   ② 原始规划号（抬号之前的 RAW）必须高于构建开始时的已发布最大 —— 拦 run_number 归零
          #      （换仓库 / 换 CI）与号段规则写错。
          # ② 之所以比 RAW 而不是比 NEXT：Resolve 的兜底会把异常号直接抬到 MAX+1，
          # 若拿抬号后的值来比，该断言恒成立、形同没有断言，正是本闸门要拦的那类事故反而漏过。
          # 正常流程 RAW 恒等于「已发布最大 + 1」（Release 号 = build_max + N + 1），不会误报；
          # 判定基准固定，并发发版也不再影响结果。
          PLANNED="${KOIL_CI_VERSION_CODE:-}"
          RAW="${KOIL_CI_VERSION_CODE_RAW:-}"
          SNAPSHOT_MAX="${KOIL_CI_MAX_PUBLISHED:-}"
          if [ -z "$PLANNED" ] || [ -z "$RAW" ] || [ -z "$SNAPSHOT_MAX" ]; then
            echo "::error::versionCode 快照未注入（PLANNED=${PLANNED:-<空>} RAW=${RAW:-<空>} MAX=${SNAPSHOT_MAX:-<空>}），Resolve 步骤是否被跳过？"
            exit 1
          fi
          if [ "$VC" != "$PLANNED" ]; then
            echo "::error::APK versionCode $VC ≠ 规划号 $PLANNED（app/build.gradle.kts 是否被手工指号，或 aapt 读取异常）"
            exit 1
          fi
          echo "versionCode 与规划号一致：$VC"
          if [ "$RAW" -le "$SNAPSHOT_MAX" ]; then
            echo "::error::原始规划号 $RAW ≤ 构建开始时已发布最大 $SNAPSHOT_MAX（run_number 是否归零？号段规则是否被改动？）"
            exit 1
          fi
          echo "versionCode 校验通过：$VC（原始规划号 $RAW > 构建开始时已发布最大 $SNAPSHOT_MAX）"


      - name: Upload APK (artifact 供日常查看，下载为原文件)
        uses: actions/upload-artifact@v7
        with:
          name: KOiL-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          archive: false
