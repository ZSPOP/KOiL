# Gitee Mirror —— 手动补传
#
# 把已经发布在 GitHub 的 Release 附件，镜像到 Gitee。
#
# 为什么不复用 android-release.yml 的 workflow_dispatch：
#   那条链在 Verify 步骤有「同名 Release 已存在即失败」的闸门，dispatch 到已有 tag
#   （比如 V1.1.5）会在构建闸门就 exit 1，根本走不到镜像步骤；而且它会重新构建、
#   重新推导 versionCode —— 那叫重发一版，不是补传。
#   补传需要的是「拿已有产物再传一次」，所以独立成一条 chain，只下载 + 镜像。
#
# 镜像实现与 android-release.yml 共用 .github/scripts/gitee-mirror.sh。
#
# 用法：Actions → Gitee Mirror → Run workflow → 填 tag（如 V1.1.5）。
name: Gitee Mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要补传到 Gitee 的 GitHub Release 标签（如 V1.1.5）'
        required: true
        type: string
      # 脚本取自哪个 ref。默认 main = 原行为不变；验证 PR 里的脚本改动能指到分支，
      # 否则 checkout 永远拿 main 的脚本，分支 dispatch 会把要修的毛病原样复现一遍。
      script_ref:
        description: '脚本取自哪个 ref（默认 main；验证 PR 时填分支名）'
        required: false
        default: 'main'
        type: string
      # 下面两个默认值与 android-release.yml 保持一致，不填就完全维持原行为。
      # 存在意义是能不改文件就验证清理：默认 keep=5 且 dry-run，攒不满 5 条时
      # 删除路径永远不会被执行到，等于零覆盖。
      keep:
        description: '清理时保留的版本数（版本号最高的 N 个；0 = 只留当前补传的这个）'
        required: false
        default: '5'
        type: string
      dry_run:
        description: '清理只演练不下手（true = 只打印将删清单）'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      # 孤儿 tag 清理入口。/releases 里已经没有对应 Release 的 tag，正常清理
      # （候选从 /releases 构造）永远扫不到，只能点名。历史遗留的 V1.1.3 / V1.1.4
      # 就是这么来的：先删 Release、后删 tag，而那条 tag 删除路径 100% 失败。
      # 删除顺序已在脚本里对调（tag 先删），后续不会再新增孤儿。
      extra_tags:
        description: '额外点名删除的孤儿 tag，逗号分隔（如 V1.1.3,V1.1.4）；留空则跳过'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: "gitee-mirror-${{ inputs.tag }}"
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 最坏路径的加总：上传 1200s + 校验 600s = 1800s，这已经正好是 30 分钟，
    # 还要再加清理的 DELETE（CURL 那套 --max-time 180 --retry 2，单次最坏约 540s，
    # 每条 Release 删 Release + 删 tag 两次调用）。设 30 会在 curl 自己放弃之前
    # 先把 job 杀掉，日志只剩 cancelled，看不出是谁的锅。45 让 curl 先放弃、留下原因。
    # 正常路径实测最坏 12 分钟，3.75 倍余量。
    timeout-minutes: 45
    steps:
      # 固定从 main 取脚本：补传用的必须是被合并、被评审过的实现，
      # 而不是 dispatch 时随手选中的分支。
      - name: Checkout scripts from main
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.script_ref || 'main' }}

      - name: Download published APK from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^V[0-9]+ ]]; then
            echo "::error::tag 必须是 V 标签（Vx.y.z），实际是 ${TAG}"; exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'KOiL-*.apk' --dir .
          ls -l KOiL-*.apk
          APKF=$(ls KOiL-*.apk | head -1)
          echo "KOIL_MIRROR_APK=$APKF" >> "$GITHUB_ENV"

      - name: Mirror to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_MIRROR_KEEP: ${{ inputs.keep }}
          GITEE_MIRROR_DRY_RUN: ${{ inputs.dry_run }}
          GITEE_MIRROR_EXTRA_TAGS: ${{ inputs.extra_tags }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/gitee-mirror.sh "$KOIL_MIRROR_APK" "$TAG"
