# KOiL Build（v1.6.0 引入，仿 Mishka 结构）
#
# 触发：推送 main / 推送大写 V 标签（V1.6.0，与 App versionName 风格统一）/ 手动 workflow_dispatch。
#       文档（*.md）改动不触发构建。
# 产物：app-release.apk（release 签名，keystore 取自仓库内 keystore/ + keystore.properties——私有仓库简化做法）。
# versionCode：注入 KOIL_CI_RUN_NUMBER = github.run_number，+251 偏移在 app/build.gradle.kts 内完成
#   （GitHub Actions 表达式不支持 +），与本地 252 基准衔接、全局单调递增。
#
# 注意：仓库内 keystore 为私有仓库简化做法；若仓库设公开，请迁移至 GitHub Secrets
#   （如 SIGNING_KEY=base64(keystore)、KEY_STORE_PASSWORD），在下方签名步骤解码，勿随仓库分发。
name: Build

on:
  push:
    branches: [main]
    tags: ['V*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KOIL_CI_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages (runner 预装 SDK，用预装 sdkmanager 补 platform 37 + build-tools 37)
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          ln -sfn "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37.0" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Upload APK (artifact 供日常查看，下载为原文件)
        uses: actions/upload-artifact@v7
        with:
          name: KOiL-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          archive: false

      # 打 V 标签（如 V1.6.0）时自动发布 Release，附件即 APK 原文件，直接下载无需解压
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/V')
        run: cp app/build/outputs/apk/release/app-release.apk "KOiL-${GITHUB_REF_NAME}-release.apk"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: KOiL-*.apk
          generate_release_notes: true
