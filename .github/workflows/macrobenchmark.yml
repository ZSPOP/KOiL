# KOiL 冷启动量化（Macrobenchmark）
#
# 手动触发。跑 StartupBenchmark 的三个编译模式（None / Partial / Full），
# 用差值回答「baseline profile 值不值、还有多少空间」。
#
# 与 baseline-profile.yml 共用同一套模拟器环境；区别是不录 profile，只测量，
# 结果以 benchmark JSON 形式上传 artifact。
#
# 只读：不 push、不发 Release。
name: Startup Benchmark

on:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure cold startup
    runs-on: ubuntu-latest
    # 3 个测试 × 3 次迭代，每组都要重装 APK + 重新编译，留足余量
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          ln -sfn "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37.0" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 只跑 StartupBenchmark，不碰 BaselineProfileGenerator（避免顺手重录 profile）
      #
      # 两个 benchmark 参数都是必需的，缺一个测试就会被 assumption 跳过（表面 success，实则零数据）：
      # - enabledRules：官方文档写明「默认未指定」，未指定时 MacrobenchmarkRule 的
      #   assumeTrue(contains(Macrobenchmark)) 直接失败 —— 第一跑就是这么空转的；
      # - suppressErrors=EMULATOR：模拟器上不声明会被 benchmark 当错误抛出。
      - name: Measure startup on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            ./gradlew :baselineprofile:connectedNonMinifiedReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.llpop.koil.baselineprofile.StartupBenchmark
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
            --no-daemon --console=plain

      - name: Locate benchmark output
        if: always()
        run: |
          echo "== benchmark data =="
          find baselineprofile/build -name "*benchmarkData.json" -o -name "*.json" -path "*additional*" 2>/dev/null | sort

      # 空跑不能伪装成功：测试被 assumption 跳过时 Gradle 仍报 success、exit code 0，
      # 上一跑三个用例全部 skipped 却整条 job 绿，所以这里显式把关
      - name: Fail if tests were skipped
        if: always()
        run: |
          XML=$(find baselineprofile/build -name "TEST-*.xml" -path "*androidTest-results*" | head -1)
          echo "result xml: $XML"
          if [ -z "$XML" ]; then
            echo "::error::找不到测试结果 XML"
            exit 1
          fi
          if grep -q "AssumptionViolatedException" "$XML"; then
            echo "::error::StartupBenchmark 被 assumption 跳过，本次没有任何测量数据"
            grep -o 'name="coldStartup[A-Za-z]*"' "$XML" | sort -u
            exit 1
          fi
          echo "用例已真实执行"

      - name: Upload reports and benchmark data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-benchmark
          if-no-files-found: warn
          path: |
            baselineprofile/build/outputs/androidTest-results/**
            baselineprofile/build/outputs/connected_android_test_additional_output/**
            baselineprofile/build/reports/androidTests/**
