# 依赖与 CI 版本守门。
#
# 目的只有一个：让「上游删了模块 / 改了包名」这类破坏性变更先以 PR 形式出现，
# 而不是等 App 下次编译时才炸。miuix 已经发生过一次（miuix-navigation3-ui → miuix-nav）。
#
# 策略：
# - 每周一聚合一次，不逐条轰炸（`groups`）；同一生态的更新合并成一个 PR，review 面可控。
# - 单个生态同时最多 5 个 PR，超出不再开新的，避免堆积。
# - 只开 PR，不自动合并：版本升级仍然要人看 changelog 后手动合。
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      # 常规小版本与补丁：合并成一个 PR，避免 20 个单条 PR 把 review 面撑爆
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
