distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方源 services.gradle.org 会把请求 307 到 GitHub Releases，
# 而 gradle-9.8.2-bin.zip 在该地址持续返回 504（2026-11-08 实测），导致 CI 无法启动 Gradle。
# 改用腾讯云镜像下载，并用 distributionSha256Sum 锁定官方哈希：
# 镜像文件与 services.gradle.org/distributions/gradle-9.8.2-bin.zip.sha256 完全一致，
# 校验不通过时 wrapper 会直接拒绝，镜像被污染也无法进入构建。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.8.2-bin.zip
distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
